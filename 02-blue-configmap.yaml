# Purpose: Store non-sensitive Blue Team configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-team-config
  namespace: voting-system
  labels:
    app: votevibe-blue
    team: blue
data:
  ACCENT_HEX: '#42a5f5'
  APP_PORT: "5000"
  BG_HEX: '#1a237e'
  LOG_LEVEL: INFO
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  TEAM_COLOR: blue
  TEAM_NAME: Blue Team
  VOTE_KEY: blue_votes
